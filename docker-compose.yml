# Starten:  docker compose up -d --build
# Daarna:   https://<SPEL_ADRES>   (zie Caddyfile en instruction.md, hoofdstuk 7)
#
# SPEL_ADRES zet je in een bestand .env naast dit bestand, bijvoorbeeld:
#   SPEL_ADRES=spel.jouwdomein.nl          -> certificaat van Let's Encrypt
#   SPEL_ADRES=192.168.1.50                -> eigen certificaat van Caddy (alleen thuisnetwerk)
services:
  spel:
    build: .
    image: pesten-spel
    container_name: pesten-spel
    restart: unless-stopped
    # Geen "ports": het spel is alleen via Caddy (https) bereikbaar.
    environment:
      SPEL_HTTPS: "1"
      TZ: Europe/Amsterdam       # tijden in het auditlog in Nederlandse tijd
      # Wie mag spelen (uit .env); leeg = iedereen. Goedgekeurde aanmeldingen komen erbij
      # uit database/toegestane_emails.txt (zie toegang.sh).
      TOEGESTANE_EMAILS: ${TOEGESTANE_EMAILS:-}
      # Registreren: nieuwe spelers mailen dit adres; leeg = geen knop Registreren.
      WEBMASTER_EMAIL: ${WEBMASTER_EMAIL:-}
    volumes:
      # De database (spelers, instellingen en scores).
      - database:/app/database
    # Beveiliging: het spel zit alleen op het netwerk "intern" (internal: geen verbinding naar
    # buiten, dus ook niet naar het thuisnetwerk, de router of de Pi zelf). Alleen Caddy kan erbij.
    networks: [intern]
    read_only: true            # alleen /app/database (volume) en /tmp zijn beschrijfbaar
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m

  caddy:
    image: caddy:2.10
    container_name: pesten-caddy
    restart: unless-stopped
    depends_on:
      - spel
    ports:
      - "80:80"       # http: Caddy stuurt door naar https
      - "443:443"     # https
      - "443:443/udp" # http/3
    environment:
      SPEL_ADRES: ${SPEL_ADRES:-localhost}
      EXTRA_ADRESSEN: ${EXTRA_ADRESSEN:-}   # het spel werkt ook op deze adressen
      DOORSTUREN: ${DOORSTUREN:-}           # deze adressen sturen door naar SPEL_ADRES
    # Caddy zit op "intern" (naar het spel), "websites" (naar de website van Oliver Lux)
    # en "web" (internet: certificaten en bezoekers).
    networks: [intern, websites, web]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # poort 80 en 443
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificaten
      - caddy_config:/config

networks:
  intern:
    internal: true   # geen verbinding naar buiten
  # Gedeeld met de website van Oliver Lux (../OliverLux): die zit alleen op dit netwerk.
  websites:
    name: websites
    internal: true
  web: {}

volumes:
  database:
  caddy_data:
  caddy_config:
