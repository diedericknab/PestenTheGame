{# Iconen als lijntekening (24 x 24, de kleur komt van de tekst). Gebruik:
   {% from "iconen.html" import icoon %} ... {{ icoon("deur") }} #}
{% macro icoon(naam) -%}
<svg class="icoon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
{%- if naam == "tandwiel" %}
  <circle cx="12" cy="12" r="3"/>
  <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>
  <circle cx="12" cy="12" r="6.5"/>
{%- elif naam == "deur" %}
  <path d="M14 3H6v18h8"/>
  <path d="M14 3l5 2v14l-5 2z" fill="currentColor" stroke-width="1.5"/>
  <path d="M3 12h7M7 9l3 3-3 3"/>
{%- elif naam == "microfoon" %}
  <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
  <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>
{%- elif naam == "microfoon-uit" %}
  <rect x="9" y="3" width="6" height="11" rx="3"/>
  <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7M4 4l16 16"/>
{%- elif naam == "camera" %}
  <rect x="3" y="7" width="12" height="10" rx="2" fill="currentColor"/>
  <path d="M15 10.5l6-3.5v10l-6-3.5z" fill="currentColor"/>
{%- elif naam == "camera-uit" %}
  <rect x="3" y="7" width="12" height="10" rx="2"/>
  <path d="M15 10.5l6-3.5v10l-6-3.5zM3 4l17 16"/>
{%- elif naam == "ophangen" %}
  <path d="M3 13.5c5-4.5 13-4.5 18 0l-2.2 2.6-3.6-1.6v-2.4a9 9 0 0 0-6.4 0v2.4l-3.6 1.6z" fill="currentColor"/>
{%- elif naam == "zandloper" %}
  <path d="M7 3h10M7 21h10"/>
  <path d="M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/>
  <path d="M10 19h4l-2-2.5z" fill="currentColor" stroke-width="1"/>
{%- endif %}
</svg>
{%- endmacro %}
